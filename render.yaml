# Render blueprint for MCP Guardian (one Docker web service).
# Secrets are not stored here: set them in the Render dashboard (sync: false).
services:
  - type: web
    name: mcp-guardian
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      - key: GUARDIAN_PUBLIC_URL        # the service's own address, for OAuth sign-in callbacks
        sync: false
      - key: GUARDIAN_ACCESS_KEY        # optional: require a key for runs
        sync: false
      - key: GUARDIAN_LLM_RUNS_PER_DAY  # AI-inspector runs per day for the whole site (the free model allows about 50 requests a day)
        value: "25"
      - key: GUARDIAN_VERSION
        value: render
      - key: GUARDIAN_LAB               # lazy: start only the DVMCP challenge server that is picked (~25 MB each, stopped when idle)
        value: lazy                     # "on" starts all ten (needs ~200 MB more); "off" hides the lab on this site
