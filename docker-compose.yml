# MCP Guardian, production: three containers.
#   web       the React app + Caddy; proxies the API and WebSocket to backend      -> the only published ports (80, and 443 for HTTPS)
#   backend   the API (FastAPI), the CrewAI/ADK inspectors, the A2A case manager
#   dvmcp-lab the ten deliberately vulnerable DVMCP servers, a sidecar of backend (shares its network namespace,
#             so they listen on 127.0.0.1 and nothing else can reach them)
#
# The site is served over plain HTTP on the server's address (an EC2 Elastic IP) by default. Setting GUARDIAN_SITE_ADDRESS to a host name
# (production uses 43-205-72-210.sslip.io) makes Caddy obtain a Let's Encrypt certificate and serve HTTPS; no domain purchase is needed.
#   cp deploy/production.env.example deploy/production.env      # fill in the three secrets
#   ln -sf deploy/production.env .env                           # so optional settings reach `docker compose` too
#   for s in backend dvmcp-lab web; do docker compose build "$s"; done      # one at a time: low memory
#   docker compose up -d
services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    env_file: deploy/production.env
    environment:
      GUARDIAN_LAB_ISOLATED: "1"                            # the DVMCP lab is the sealed sidecar below, so visitors may run all ten challenges
      GUARDIAN_PUBLIC_URL: "${GUARDIAN_PUBLIC_URL:-}"       # optional: the address OAuth sign-ins return to; empty = the page's own address
    volumes:
      - guardian-state:/app/logs               # fingerprints, case history, model answer cache
    expose:
      - "8000"
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: &logs
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  dvmcp-lab:
    build:
      context: ./backend
      dockerfile: Dockerfile.lab
    restart: unless-stopped
    init: true
    network_mode: "service:backend"
    depends_on:
      backend:
        condition: service_healthy
        restart: true        # the lab shares the backend's network; if only the backend restarts, the lab must restart too or it is cut off
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 512m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logs

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      GUARDIAN_SITE_ADDRESS: "${GUARDIAN_SITE_ADDRESS:-:80}"       # ":80" = HTTP on any address; a domain name = automatic HTTPS
    ports:
      - "80:80"
      - "443:443"            # HTTPS, used once GUARDIAN_SITE_ADDRESS is a host name that points at this server (idle on plain :80)
    volumes:
      - caddy-data:/data                       # certificates (used only in HTTPS mode)
      - caddy-config:/config
    mem_limit: 256m
    logging: *logs

volumes:
  guardian-state:
  caddy-data:
  caddy-config:
