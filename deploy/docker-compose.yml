# MCP Guardian on a single VPS: the app (web app + API + the ten DVMCP lab servers) behind Caddy, which obtains
# and renews the HTTPS certificate by itself. Run from the repository root:
#   cp deploy/server.env.example deploy/server.env     # then fill in the keys
#   docker compose -f deploy/docker-compose.yml --env-file deploy/server.env up -d --build
#
# Only Caddy publishes ports (80 and 443). The app has no published port: the DVMCP lab servers are deliberately
# vulnerable and listen on 127.0.0.1 inside the app container, so nothing outside can reach them.
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: server.env
    environment:
      GUARDIAN_LAB: "on"
      GUARDIAN_PUBLIC_URL: "https://${GUARDIAN_DOMAIN}"
      GUARDIAN_VERSION: "${GUARDIAN_VERSION:-vps}"
    volumes:
      - guardian-state:/app/backend/logs        # fingerprints, case history and the model answer cache survive restarts
    expose:
      - "7860"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7860/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    environment:
      GUARDIAN_DOMAIN: "${GUARDIAN_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                        # the certificates
      - caddy-config:/config

volumes:
  guardian-state:
  caddy-data:
  caddy-config:
